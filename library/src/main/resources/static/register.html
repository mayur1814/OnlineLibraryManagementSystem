<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Online Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <a href="index.html" class="brand">
        <div class="brand-icon">📚</div>
        <div class="brand-text">
            <h1>Library Management System</h1>
            <span>Java Full Stack Academic Portal</span>
        </div>
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="active">Register</a>
    </nav>
</header>

<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Student Registration</h2>
                <p>Create a student account to browse, search, and issue books</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g., Mayur Malve" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g., student@library.com" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="text" id="mobile" class="form-control" placeholder="e.g., 9876543210" required pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number">
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" class="form-control" placeholder="At least 4 characters" required minlength="4">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="4">
                </div>

                <button type="submit" style="width: 100%;padding:0.75rem;font-size:1rem;margin-top:0.5rem;">
                    Complete Registration →
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Log in here</a>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Online Library Management System — Java Full Stack Internship Project</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
