<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | SHREE LIBRARY</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <a href="index.html" class="brand">
        <div class="brand-icon">📚</div>
        <div class="brand-text">
            <h1>SHREE LIBRARY</h1>
            <span>Academic Portal</span>
        </div>
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Sign In</a>
        <a href="register.html" class="active">Student Register</a>
    </nav>
</header>

<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Student Registration</h2>
                <p>Create your student library account to browse, search, and borrow books</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g., Mayur Malve" required>
                </div>

                <div class="form-group">
                    <label for="email">Institutional Email Address *</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g., student@library.com" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number (10 Digits) *</label>
                    <input type="text" id="mobile" class="form-control" placeholder="e.g., 9876543210" required pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number">
                </div>

                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.45rem;">
                        <label for="password" style="margin-bottom:0;">Create Password *</label>
                        <span style="font-size:0.8rem;color:var(--primary);cursor:pointer;font-weight:600;" onclick="togglePassword('password')">Show / Hide</span>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="At least 4 characters" required minlength="4">
                </div>

                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.45rem;">
                        <label for="confirmPassword" style="margin-bottom:0;">Confirm Password *</label>
                        <span style="font-size:0.8rem;color:var(--primary);cursor:pointer;font-weight:600;" onclick="togglePassword('confirmPassword')">Show / Hide</span>
                    </div>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="4">
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:0.95rem;margin-top:0.5rem;">
                    Complete Registration →
                </button>
            </form>

            <div style="text-align:center;margin-top:1.5rem;font-size:0.875rem;color:var(--text-secondary);">
                Already have an account? <a href="login.html" style="color:var(--primary);font-weight:700;text-decoration:none;">Log in here</a>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Online Library Management System — Student Registration</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
