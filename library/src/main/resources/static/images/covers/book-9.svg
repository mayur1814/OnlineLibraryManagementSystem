<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="bgGrad9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14251e" />
      <stop offset="50%" stop-color="#164e3f" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="spineGrad9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="accentGrad9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="240" height="340" rx="10" fill="url(#bgGrad9)" />
  <!-- Subtle Geometric Background Patterns -->
  <circle cx="190" cy="50" r="80" fill="#2dd4bf" fill-opacity="0.08" />
  <circle cx="50" cy="280" r="70" fill="#2dd4bf" fill-opacity="0.05" />
  <rect x="20" y="20" width="200" height="300" rx="6" fill="none" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3,3" />
  <!-- Category Tag -->
  <g transform="translate(30, 36)">
    <rect x="0" y="0" width="160" height="20" rx="4" fill="#2dd4bf" fill-opacity="0.18" />
    <text x="10" y="14" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1">OS ARCHITECTURE</text>
  </g>
  <!-- Thematic Icon Symbol -->
  <g transform="translate(186, 36)">
    <circle cx="12" cy="10" r="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="5" y="15" font-size="14">&#x2699;&#xFE0F;</text>
  </g>
  <!-- Title & Subtitle -->
  <text x="30" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5">
    Operating System
  </text>
  <text x="30" y="130" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    Concepts
  </text>
  <!-- Decorative Divider Line -->
  <rect x="30" y="150" width="45" height="3" rx="1.5" fill="url(#accentGrad9)" />
  <!-- Academic Badge / ID Box -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="180" height="60" rx="6" fill="#000000" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-transform="uppercase" letter-spacing="0.5">CATALOG ITEM</text>
    <text x="14" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">BOOK #9</text>
    <rect x="135" y="14" width="32" height="32" rx="4" fill="#2dd4bf" fill-opacity="0.15" />
    <text x="142" y="34" font-size="14">&#x2699;&#xFE0F;</text>
  </g>
  <!-- Author Name -->
  <text x="30" y="280" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5" text-transform="uppercase">AUTHOR</text>
  <text x="30" y="300" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">
    Silberschatz &amp; Galvin
  </text>
  <!-- 3D Book Spine Overlay (Left Edge Effect) -->
  <rect x="0" y="0" width="14" height="340" rx="10" fill="url(#spineGrad9)" />
  <line x1="14" y1="0" x2="14" y2="340" stroke="#000000" stroke-opacity="0.2" stroke-width="1" />
</svg>