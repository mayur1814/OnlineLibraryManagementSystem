<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="loadAdminBooks()">
<header>
    <h1>Admin Dashboard</h1>
    <nav>
        <a href="#" onclick="logout(); return false;">Logout</a>
    </nav>
</header>
<div class="container">
    <!-- Add Book Form -->
    <div class="card">
        <h2>Add New Book</h2>
        <form id="addBookForm" onsubmit="handleAddBook(event)">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="bookTitle" required>
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" id="bookAuthor" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="bookCategory" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="bookQuantity" min="0" required>
            </div>
            <button type="submit">Add Book</button>
        </form>
    </div>

    <!-- Manage Books Table -->
    <div class="card">
        <h2>Manage Library Books</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="adminBookTableBody"></tbody>
        </table>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
